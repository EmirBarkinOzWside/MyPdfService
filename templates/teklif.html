<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Teklif Kapak</title>
    <style>
        /* --- SAYFA YAPISI --- */
        @page { size: A4; margin: 0; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #fff; -webkit-print-color-adjust: exact; }
        
        .page-cover {
            width: 210mm;
            height: 297mm;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Üst, Orta, Alt dağılımı */
            background: white;
        }

        /* --- ÜST KISIM (Salesforce Logo) --- */
        .top-section {
            width: 100%;
            text-align: center;
            padding-top: 40px;
        }
        .sf-badge {
            width: 140px; /* Logo boyutunu buradan ayarla */
            height: auto;
        }

        /* --- ORTA KISIM (Wside | Müşteri) --- */
        .center-section {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 80px; /* Biraz yukarıda dursun */
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .wside-logo {
            height: 55px; /* Senin logonun yüksekliği */
            width: auto;
        }
        .vertical-line {
            width: 2px;
            height: 65px;
            background-color: #E31837; /* Kırmızı çizgi */
        }
        .client-name {
            font-size: 26px;
            font-weight: 600;
            color: #222;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            max-width: 350px;
            line-height: 1.2;
        }

        /* --- ALT KISIM (Footer Resmi) --- */
        .footer-section {
            width: 100%;
            line-height: 0;
        }
        .footer-img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="page-cover">
        
        <div class="top-section">
            {{#if imgSalesforce}}
                <img src="data:image/png;base64,{{imgSalesforce}}" class="sf-badge">
            {{/if}}
        </div>

        <div class="center-section">
            <div class="logo-container">
                {{#if imgWside}}
                    <img src="data:image/png;base64,{{imgWside}}" class="wside-logo">
                {{/if}}

                <div class="vertical-line"></div>
                
                <div class="client-name">
                    {{musteriIsmi}}
                </div>
            </div>
        </div>

        <div class="footer-section">
            {{#if imgFooter}}
                <img src="data:image/png;base64,{{imgFooter}}" class="footer-img">
            {{/if}}
        </div>

    </div>

</body>
</html>
